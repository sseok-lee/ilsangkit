name: Recover Missing Real Estate Months 2026-10-01

on:
  workflow_dispatch:

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Checkout reviewed recovery script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Package exact recovery targets
        run: |
          set -euo pipefail
          node --check scripts/recovery/retry-missing-20261001.mjs
          mkdir -p recovery-out
          cp scripts/recovery/retry-missing-20261001.mjs scripts/recovery/retry-targets-20261001.json recovery-out/
          cd recovery-out
          sha256sum retry-missing-20261001.mjs retry-targets-20261001.json > SHA256SUMS

      - name: Upload reviewed recovery script
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "recovery-out/*"
          target: "/home/project2/run/recovery-20261001/actions-${{ github.sha }}"
          strip_components: 1

      - name: Recheck lock and retry only 13 region-month pairs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 2h
          script: |
            set -euo pipefail
            ACTIVE_BACKEND_LINK='/home/project2/current-backend'
            ACTIVE_BACKEND_DIR="$(cd "$ACTIVE_BACKEND_LINK" && pwd -P)"
            test "$ACTIVE_BACKEND_DIR" = '/home/project2/deploy/releases/address-f80a26c09cb5/backend'
            INVENTORY='/home/project2/deploy/inventory.json'
            RUNTIME='/home/project2/deploy/releases/address-f80a26c09cb5/scripts/deploy/sync-runtime.mjs'
            RECOVERY='/home/project2/run/recovery-20261001/actions-${{ github.sha }}'
            test -f "$RUNTIME"
            cd "$RECOVERY"
            sha256sum -c SHA256SUMS
            node "$RUNTIME" print --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY"
            AVAILABLE_KB="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
            test "$AVAILABLE_KB" -ge 5242880
            cd "$ACTIVE_BACKEND_DIR"
            timeout --kill-after=30s 90m node "$RUNTIME" run \
              --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY" -- \
              node "$RECOVERY/retry-missing-20261001.mjs" "$RECOVERY/retry-targets-20261001.json"
            df -h /tmp
