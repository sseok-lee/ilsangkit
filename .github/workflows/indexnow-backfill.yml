name: IndexNow Backfill

# 네이버 색인의 SSR 열화 스냅샷 화석(기본 title '일상킷' + GNB/푸터 스니펫)을
# 재수집 요청으로 세척한다. 시설 상세 ~287k URL 을 매일 2만 건씩 IndexNow 로
# 제출 — 전체 1회전에 ~15일. 열화 유출 자체는 2026-07-29 에 수정됐으므로
# (seo-canary.yml 헤더 참고) 이 워크플로는 잔존 화석 세척 전용이다.
#
# ## 커서 상태
#
# 러너는 매번 초기화되므로 제출 커서(backend/data/indexnow-backfill.json)를
# actions/cache 로 이어간다. cache 키는 불변이라 run 마다 유일한 키로 저장하고
# restore-keys 접두 매칭으로 직전 실행의 최신 상태를 가져온다(표준 패턴).
# cache 는 best-effort — 유실되면 처음부터 다시 제출하는데, 재수집 요청 특성상
# 중복 제출은 무해하다(전체 소요일이 늘어날 뿐). 전체 제출이 끝나면 스크립트가
# "남은 미제출 URL 없음"으로 no-op 종료하므로 방치해도 안전하다.
#
# ## INDEXNOW_KEY 가 secret 이 아닌 이유
#
# IndexNow 키는 설계상 공개 값이다 — 검증을 위해 사이트 루트에 그대로 호스팅된다
# (https://ilsangkit.co.kr/a874a0a13ad86694a40ca8e2dd9a5698.txt). 평문으로 둔다.
#
# ## 스케줄 활성화 조건
#
# schedule 트리거는 default 브랜치(main)의 워크플로 파일 기준으로만 동작한다.
# develop 머지만으로는 돌지 않고 main 승격 후부터 활성화된다.

# ## 2026-08-21 스케줄 중단
#
# 자동 실행을 껐다. 수동(workflow_dispatch)은 남겨둔다.
#
# 중단 사유 — 제출량이 크롤 능력을 넘어 무의미했다:
#   - Yeti 수집완료 실측 9,296건/일 (전체 사이트 기준)
#   - 제출 20,000건/일 → 크롤 능력의 2배 이상. 제출은 요청일 뿐 크롤이 아니다.
#   - 시설 상세 287,880개 전량 재수집은 전체 크롤 예산을 100% 써도 31일.
#     그동안 실제 유입을 만드는 페이지(trash 지역집계 13.64세션/URL/14일 등)가 밀린다.
#   - 세척의 도착지가 낮다: 화석 0%인 부동산 상세가 0.0166세션/URL/14일.
#     시설 상세는 현재 0.0102. 세척 상한은 전체 트래픽의 +11~27% 일회성이고,
#     감쇠 -17.6%/주를 되돌리지는 못한다.
#
# ## 남겨둔 자연 실험 — 재개 전에 반드시 읽을 것
#
# 중단 시점에 정확히 220,000 / 287,880 제출됐다(잔여 67,880).
# DEFAULT_CATEGORY_ORDER 가 고정 순서라 처치/대조가 카테고리 단위로 깔끔히 갈린다.
#
#   세척됨(처치): hospital, pharmacy, school, parking, toilet, childcare, market,
#                sports(10,000 중 8,148)
#   미세척(대조): sports 잔여 1,852, clothes 10,000, ev-charger 20,000,
#                aed 15,000, library 3,832, park 17,196
#
# 2026-08-21 실측 화석률(네이버 site: 쿼리, title=='일상킷' 기준):
#   세척 그룹 64.8% (n=267) / 미세척 그룹 55.9% (n=236) / 부동산 상세 0.0% (n=93)
#
# 재크롤은 수 주가 걸리므로 효과는 2026-09월 중순 이후에야 읽힌다. 그때까지
# 대조 카테고리를 제출하면 유일한 측정 기회가 사라진다. 재개하려면 --categories 로
# 처치군만 지정하거나, 측정을 끝낸 뒤에 하라.

on:
  # schedule:
  #   # 01:37 UTC = 10:37 KST. 재개 시 크롤 능력(약 9,000/일)에 맞춰 limit 을 낮출 것.
  #   - cron: '37 1 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '이번 실행 제출 상한'
        default: '20000'
        required: false

concurrency:
  group: indexnow-backfill
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Restore submission cursor
        uses: actions/cache/restore@v4
        with:
          path: backend/data/indexnow-backfill.json
          key: indexnow-backfill-state-${{ github.run_id }}
          restore-keys: |
            indexnow-backfill-state-

      - name: Install dependencies
        run: npm ci

      - name: Submit batch
        env:
          INDEXNOW_KEY: a874a0a13ad86694a40ca8e2dd9a5698
        run: npx tsx src/scripts/submitIndexNowBackfill.ts --limit ${{ github.event.inputs.limit || '20000' }}

      # 스크립트는 성공한 배치까지만 커서를 기록하고 exit 0 으로 끝난다.
      # 제출 전 단계(사이트맵 fetch 등)에서 죽으면 exit 1 → 저장 스킵(상태 파일 부재).
      - name: Save submission cursor
        uses: actions/cache/save@v4
        with:
          path: backend/data/indexnow-backfill.json
          key: indexnow-backfill-state-${{ github.run_id }}
