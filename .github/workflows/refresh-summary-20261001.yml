name: Refresh Real Estate Summaries 2026-10-01

on:
  workflow_dispatch:

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: test "$GITHUB_REF" = 'refs/heads/main'

      - name: Checkout reviewed verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Package summary verifier
        run: |
          set -euo pipefail
          node --check scripts/recovery/verify-summary-20261001.mjs
          mkdir -p summary-out
          cp scripts/recovery/verify-summary-20261001.mjs summary-out/
          cd summary-out
          sha256sum verify-summary-20261001.mjs > SHA256SUMS

      - name: Upload reviewed verifier
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "summary-out/*"
          target: "/home/project2/run/recovery-20261001/summary-${{ github.sha }}"
          strip_components: 1

      - name: Refresh six summaries and verify published URLs
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 45m
          script: |
            set -euo pipefail
            ACTIVE_BACKEND_LINK='/home/project2/current-backend'
            ACTIVE_BACKEND_DIR="$(cd "$ACTIVE_BACKEND_LINK" && pwd -P)"
            test "$ACTIVE_BACKEND_DIR" = '/home/project2/deploy/releases/address-f80a26c09cb5/backend'
            INVENTORY='/home/project2/deploy/inventory.json'
            RUNTIME='/home/project2/deploy/releases/address-f80a26c09cb5/scripts/deploy/sync-runtime.mjs'
            VERIFIER='/home/project2/run/recovery-20261001/summary-${{ github.sha }}'
            cd "$VERIFIER"
            sha256sum -c SHA256SUMS
            node "$RUNTIME" print --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY"
            AVAILABLE_KB="$(df -Pk /tmp | awk 'NR == 2 { print $4 }')"
            test "$AVAILABLE_KB" -ge 5242880
            cd "$ACTIVE_BACKEND_DIR"
            timeout --kill-after=30s 35m node "$RUNTIME" run \
              --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY" -- \
              node dist/scripts/refreshRealEstateSummary.js
            timeout --kill-after=30s 5m node "$RUNTIME" run \
              --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY" -- \
              node "$VERIFIER/verify-summary-20261001.mjs"
            df -h /tmp
