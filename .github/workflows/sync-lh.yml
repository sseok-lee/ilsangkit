name: Sync LH Data

on:
  schedule:
    # LH 청약공고 — 매일 04:30 KST = UTC 19:30 (전날)
    - cron: '30 19 * * *'
    # LH 매입·전세 매물 (myhome 카탈로그) — 매주 일요일 05:30 KST = UTC 20:30 (토요일)
    - cron: '30 20 * * 6'
  workflow_dispatch:
    inputs:
      sync_target:
        description: 'Which LH sync to run'
        required: false
        default: 'both'
        type: choice
        options:
          - announcement
          - public-rent
          - both

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync LH Data on Server
        # v1.2.5 (2026-01-28) — sync-real-estate.yml 와 동일 SHA pin.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        env:
          SCHEDULE_CRON: ${{ github.event.schedule }}
          DISPATCH_TARGET: ${{ github.event.inputs.sync_target }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          envs: SCHEDULE_CRON,DISPATCH_TARGET
          command_timeout: 1h30m
          script: |
            set -u
            set -x
            echo "[step:start] $(date -u +%FT%TZ)"
            cd /home/project2/backend
            echo "[step:cwd-ok] $(pwd)"

            # cron / workflow_dispatch 입력으로 실행 대상 결정.
            # SCHEDULE_CRON 은 schedule 트리거 시에만 채워지고,
            # DISPATCH_TARGET 은 workflow_dispatch 시에만 채워진다.
            RUN_ANNOUNCEMENT=false
            RUN_PUBLIC_RENT=false
            case "$SCHEDULE_CRON" in
              "30 19 * * *") RUN_ANNOUNCEMENT=true ;;
              "30 20 * * 6") RUN_PUBLIC_RENT=true ;;
            esac
            case "$DISPATCH_TARGET" in
              announcement) RUN_ANNOUNCEMENT=true ;;
              public-rent) RUN_PUBLIC_RENT=true ;;
              both) RUN_ANNOUNCEMENT=true; RUN_PUBLIC_RENT=true ;;
            esac
            echo "[step:plan announcement=$RUN_ANNOUNCEMENT public-rent=$RUN_PUBLIC_RENT]"

            # 좀비 청소 (sync-real-estate.yml 패턴 그대로).
            kill_sync_zombies() {
              local pid cmd
              for pid in $(pgrep -x node 2>/dev/null); do
                cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null)
                case "$cmd" in
                  *dist/scripts/syncLhAnnouncement*|\
                  *dist/scripts/syncPublicRent*)
                    kill -9 "$pid" 2>/dev/null || true
                    ;;
                esac
              done
            }

            echo "[step:pre-kill]"
            kill_sync_zombies
            echo "[step:pre-kill-done exit=$?]"
            echo "[step:pre-mysql-show]"
            mysql -e "SHOW PROCESSLIST" 2>/dev/null \
              | awk '$2=="ilsangkit" && $6+0 > 1800 && $5!="Sleep" {print "KILL "$1";"}' \
              | mysql 2>/dev/null || true
            echo "[step:pre-mysql-done exit=$?]"

            # dist 산출물 존재 선행 체크
            if [ "$RUN_ANNOUNCEMENT" = true ] && [ ! -f dist/scripts/syncLhAnnouncement.js ]; then
              echo "[error] dist/scripts/syncLhAnnouncement.js 미존재 — Deploy 워크플로우 선행 실행 필요"
              exit 2
            fi
            if [ "$RUN_PUBLIC_RENT" = true ] && [ ! -f dist/scripts/syncPublicRent.js ]; then
              echo "[error] dist/scripts/syncPublicRent.js 미존재 — Deploy 워크플로우 선행 실행 필요"
              exit 2
            fi
            echo "[step:dist-ok]"

            if [ "$RUN_ANNOUNCEMENT" = true ]; then
              echo "[step:announcement-start] $(date -u +%FT%TZ)"
              echo "--- LH 청약공고 동기화 ---"
              # 1년 lookback + per-item rate limit. 평균 5~15분.
              timeout --kill-after=30s 30m node dist/scripts/syncLhAnnouncement.js \
                || echo "[WARN] syncLhAnnouncement 실패 (exit=$?)"
              echo "[step:announcement-end]"
            fi

            if [ "$RUN_PUBLIC_RENT" = true ]; then
              echo "[step:public-rent-start] $(date -u +%FT%TZ)"
              echo "--- LH 매입·전세 매물 동기화 (myhome 전국) ---"
              # 전국 카탈로그 풀 sync. 평균 30~60분.
              timeout --kill-after=30s 75m node dist/scripts/syncPublicRent.js \
                || echo "[WARN] syncPublicRent 실패 (exit=$?)"
              echo "[step:public-rent-end]"
            fi

            echo "[step:post-kill]"
            kill_sync_zombies
            echo "[step:post-mysql]"
            mysql -e "SHOW PROCESSLIST" 2>/dev/null \
              | awk '$2=="ilsangkit" && $6+0 > 1800 && $5!="Sleep" {print "KILL "$1";"}' \
              | mysql 2>/dev/null || true
            echo "[step:post-done]"

            echo "=== LH 동기화 완료 ==="
