name: Deploy to Cafe24

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_id:
        description: 'Staged release to resume after a failed pre-switch deploy'
        required: true
        type: string

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' }}
    outputs:
      deploy_required: ${{ steps.scope.outputs.deploy_required }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Skip automatic release for controller-only changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$(git diff --name-only HEAD^ HEAD)"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/deploy.yml|.github/workflows/recover-missing-20261001.yml|scripts/deploy/release.mjs|scripts/deploy/release.test.mjs|scripts/deploy/workflow.test.mjs|scripts/recovery/retry-missing-20261001.mjs|scripts/recovery/retry-targets-20261001.json) ;;
              *) echo 'deploy_required=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$changed_paths"
          echo 'deploy_required=false' >> "$GITHUB_OUTPUT"

  deploy:
    needs: plan
    runs-on: ubuntu-latest
    if: ${{ needs.plan.outputs.deploy_required == 'true' }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_INTERNAL_API_BASE: ${{ secrets.NUXT_INTERNAL_API_BASE }}
          NUXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NUXT_PUBLIC_KAKAO_MAP_KEY }}
          NUXT_PUBLIC_GA_ID: ${{ secrets.NUXT_PUBLIC_GA_ID }}
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}

      - name: Package release artifacts
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RELEASE_ID="address-${HEAD_SHA:0:12}"
          mkdir -p release-out/backend release-out/frontend release-out/scripts/deploy
          cp -R backend/dist backend/package*.json backend/prisma release-out/backend/
          cp -R frontend/.output release-out/frontend/
          cp scripts/deploy/release.mjs scripts/deploy/deployment-state.mjs scripts/deploy/sync-runtime.mjs scripts/deploy/nginx-release.conf.template release-out/scripts/deploy/
          cp ecosystem.release.config.cjs release-out/
          node - "$RELEASE_ID" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const releaseId = process.argv[2]
          const nuxtDir = path.resolve('frontend/.output/public/_nuxt')
          const assets = []
          function walk(dir) {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile()) {
                const relativePath = path.relative(nuxtDir, full).split(path.sep).join('/')
                if (relativePath === 'builds/latest.json') continue
                assets.push({
                  path: `/home/project2/deploy/releases/${releaseId}/frontend/.output/public/_nuxt/${relativePath}`,
                  fileName: relativePath,
                  sha256: crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex'),
                })
              }
            }
          }
          walk(nuxtDir)
          if (assets.length === 0) throw new Error('no hashed frontend _nuxt assets found')
          fs.writeFileSync('release-out/hashed-assets.json', JSON.stringify(assets, null, 2) + '\n')
          NODE
          tar -C release-out/backend -czf release-out/backend.tgz .
          tar -C release-out/frontend -czf release-out/frontend.tgz .
          BACKEND_SHA="$(sha256sum release-out/backend.tgz | awk '{print $1}')"
          FRONTEND_SHA="$(sha256sum release-out/frontend.tgz | awk '{print $1}')"
          cat > release-out/manifest.json <<JSON
          {
            "releaseId": "${RELEASE_ID}",
            "commitSha": "${HEAD_SHA}",
            "workflowSha": "${HEAD_SHA}",
            "backendArtifact": { "path": "/home/project2/release-inbox/${RELEASE_ID}/backend.tgz", "sha256": "${BACKEND_SHA}" },
            "frontendArtifact": { "path": "/home/project2/release-inbox/${RELEASE_ID}/frontend.tgz", "sha256": "${FRONTEND_SHA}" }
          }
          JSON
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Upload immutable release bundle
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release-out/*"
          target: "/home/project2/release-inbox/${{ env.RELEASE_ID }}"
          strip_components: 1

      - name: Validate and switch release on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            RELEASE_ID="${{ env.RELEASE_ID }}"
            INBOX="/home/project2/release-inbox/${RELEASE_ID}"
            INVENTORY="/home/project2/deploy/inventory.json"
            MANIFEST="${INBOX}/manifest.json"
            RELEASE_SCRIPT="${INBOX}/scripts/deploy/release.mjs"
            HASHED_ASSETS="${INBOX}/hashed-assets.json"
            if [ ! -f "$INVENTORY" ]; then
              echo "[deploy] missing C1 inventory: $INVENTORY" >&2
              exit 2
            fi
            if [ ! -f "$HASHED_ASSETS" ]; then
              echo "[deploy] missing hashed asset manifest: $HASHED_ASSETS" >&2
              exit 2
            fi

            SUMMARY_READY="$(node - "$INVENTORY" <<'NODE'
            const fs = require('node:fs')
            const inventory = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
            const activeBackendPort = inventory.active?.backend?.port || 8000
            process.stdout.write(`http://127.0.0.1:${activeBackendPort}/api/internal/release-readiness`)
            NODE
            )"
            SUMMARY_READINESS="$(curl -fsS "$SUMMARY_READY")"

            printf '%s' "$SUMMARY_READINESS" > "$INBOX/readiness.json"
            node "$INBOX/scripts/deploy/deployment-state.mjs" "$INVENTORY" "$MANIFEST" "$HASHED_ASSETS" "$INBOX/readiness.json"

            node "$RELEASE_SCRIPT" deploy --inventory "$INVENTORY" --manifest "$MANIFEST"
            node "$RELEASE_SCRIPT" reconcile --inventory "$INVENTORY" --manifest "$MANIFEST"

      - name: Deployment Status
        run: echo "✅ Release switch completed"

  resume:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - name: Validate staged release identity
        env:
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$RELEASE_ID" = 'address-f80a26c09cb5'

      - name: Checkout tested controller
        uses: actions/checkout@v4

      - name: Package resume controller
        run: |
          mkdir -p resume-out/scripts/deploy
          cp scripts/deploy/release.mjs scripts/deploy/deployment-state.mjs resume-out/scripts/deploy/

      - name: Upload resume controller
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "resume-out/*"
          target: "/home/project2/run/recovery-20261001/controller-${{ github.sha }}"
          strip_components: 1

      - name: Recheck and resume staged release
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          script: |
            set -euo pipefail
            RELEASE_ID='address-f80a26c09cb5'
            INBOX="/home/project2/release-inbox/${RELEASE_ID}"
            INVENTORY='/home/project2/deploy/inventory.json'
            MANIFEST="${INBOX}/manifest.json"
            CONTROLLER='/home/project2/run/recovery-20261001/controller-${{ github.sha }}/scripts/deploy/release.mjs'

            node - "$INVENTORY" "$MANIFEST" <<'NODE'
            const fs = require('node:fs')
            const path = require('node:path')
            const inventory = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
            const manifest = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'))
            const activeReleaseId = 'address-8a4f145951c6'
            const candidateReleaseId = 'address-f80a26c09cb5'
            const candidateCommit = 'f80a26c09cb5cefd08e776e87e9c8034584eeb4d'
            if (inventory.active?.releaseId !== activeReleaseId) throw new Error('active release changed; inspect before resuming')
            if (manifest.releaseId !== candidateReleaseId || manifest.commitSha !== candidateCommit || manifest.workflowSha !== candidateCommit) throw new Error('staged manifest identity mismatch')
            if (manifest.rollbackReleaseId !== activeReleaseId) throw new Error('rollback release mismatch')
            if (manifest.ports?.backend !== 18002 || manifest.ports?.frontend !== 13002) throw new Error('staged candidate ports changed')
            for (const kind of ['backend', 'frontend']) {
              const expected = path.join(inventory.releasesRoot, activeReleaseId, kind)
              if (fs.realpathSync(inventory.activePointers[kind]) !== expected) throw new Error(`active ${kind} pointer changed`)
            }
            if (!fs.existsSync(path.join(inventory.releasesRoot, candidateReleaseId))) throw new Error('staged candidate install missing')
            if (fs.existsSync(path.join(inventory.deployRoot, 'locks', 'release.lock'))) throw new Error('deploy lock is held')
            NODE

            node "$CONTROLLER" resume --inventory "$INVENTORY" --manifest "$MANIFEST"
            node "$CONTROLLER" reconcile --inventory "$INVENTORY" --manifest "$MANIFEST"
