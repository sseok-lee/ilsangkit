name: Deploy to Cafe24

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build Backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_INTERNAL_API_BASE: ${{ secrets.NUXT_INTERNAL_API_BASE }}
          NUXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NUXT_PUBLIC_KAKAO_MAP_KEY }}
          NUXT_PUBLIC_GA_ID: ${{ secrets.NUXT_PUBLIC_GA_ID }}
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}

      - name: Clean old build artifacts on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            rm -rf /home/project2/frontend/.output
            rm -rf /home/project2/backend/dist

      - name: Deploy to Cafe24 Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "backend/dist,backend/package*.json,backend/prisma,frontend/.output,ecosystem.config.js"
          target: "/home/project2"
          strip_components: 0

      - name: Kill long-running queries and apply schema
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 5m
          script: |
            # 60초 이상 실행 중인 쿼리 종료 (prisma db push 전 락 해제)
            KILL_LIST=$(mysql -e "
              SELECT GROUP_CONCAT(CONCAT('KILL ', id) SEPARATOR '; ')
              FROM information_schema.processlist
              WHERE time > 60 AND command = 'Execute' AND user != 'root';
            " 2>/dev/null | tail -n 1)
            if [ -n "$KILL_LIST" ] && [ "$KILL_LIST" != "NULL" ]; then
              mysql -e "$KILL_LIST;" 2>/dev/null || true
              echo "장시간 실행 쿼리 종료: $KILL_LIST"
            fi

            cd /home/project2/backend
            npx prisma db push --accept-data-loss
            npx prisma generate

      - name: Install Dependencies and Restart Services
        uses: appleboy/ssh-action@master
        env:
          NUXT_INTERNAL_API_BASE: ${{ secrets.NUXT_INTERNAL_API_BASE }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 10m
          envs: NUXT_INTERNAL_API_BASE
          script: |
            mkdir -p /home/project2/assets/images/guides

            cd /home/project2/backend
            npm ci

            # pm2 reload 는 fork mode 단일 프로세스에서는 restart 와 동일 동작이라 무해하고,
            # 향후 cluster mode 전환 시 자동으로 zero-downtime rolling restart 로 동작한다.
            pm2 describe ilsangkit-backend > /dev/null
            if [ $? -eq 0 ]; then
              pm2 reload ilsangkit-backend
            else
              pm2 start dist/server.js --name ilsangkit-backend
            fi

            # frontend SSR이 backend를 loopback으로 직접 호출하도록 runtime env 주입.
            # --update-env 플래그로 pm2 가 기존 child process 의 env 를 현재 shell 의 env 로 교체.
            cd /home/project2/frontend
            export NUXT_INTERNAL_API_BASE
            pm2 describe ilsangkit-frontend > /dev/null
            if [ $? -eq 0 ]; then
              pm2 reload ilsangkit-frontend --update-env
            else
              pm2 start .output/server/index.mjs --name ilsangkit-frontend --update-env
            fi

            pm2 save

            # 배포 직후 콜드 부트 5xx 차단 워밍업.
            # 1) backend /api/health 폴링으로 light ready 시점 감지 (최대 30초)
            # 2) backend /api/sitemap/page-counts 폴링으로 heavy ready 감지 (최대 60초)
            #    sitemap.xml 이 의존하는 무거운 집계 쿼리 - DB 풀/Prisma 모듈 cold start
            #    완료 전에 frontend warmup 이 timeout abort → 빈/축소 sitemap 이 메모리
            #    캐시(s-maxage=86400)에 박혀 24h stale 노출되는 사고 방지 (2026-05-21 PR-B).
            # 3) frontend SSR 주요 라우트 사전 GET 으로 Nitro in-memory 캐시 + 모듈 그래프 워밍
            #    (네이버 서치어드바이저 "서버 접근 불가" 리포트의 콜드 5xx 원인 해소)
            echo "[warmup] backend /api/health 폴링"
            for i in $(seq 1 30); do
              if curl -sf -o /dev/null http://localhost:8000/api/health; then
                echo "[warmup] backend ready (${i}s)"
                break
              fi
              sleep 1
            done

            echo "[warmup] backend /api/sitemap/page-counts 폴링 (heavy endpoint ready 확인)"
            for i in $(seq 1 60); do
              if curl -sf -m 10 -o /dev/null http://localhost:8000/api/sitemap/page-counts; then
                echo "[warmup] backend heavy endpoint ready (${i}s)"
                break
              fi
              sleep 1
            done

            echo "[warmup] frontend SSR 라우트 사전 GET"
            # 부동산 허브 6개를 반드시 포함한다. 한 번의 fetch 실패가 5분 SWR 캐시
            # (s-maxage=300) 에 빈 본문으로 박히면 그 동안 모든 사용자/Googlebot 에게
            # 빈 페이지가 반환되어 색인이 막힌다 (2026-05 villa-sale 사고).
            # warmup 으로 캐시를 정상 본문으로 선점한다.
            for path in \
              / \
              /sitemap.xml \
              /sitemap/static.xml \
              /real-estate \
              /real-estate/apt-sale /real-estate/apt-rent \
              /real-estate/villa-sale /real-estate/villa-rent \
              /real-estate/offitel-sale /real-estate/offitel-rent \
              /toilet /wifi /ev-charger /hospital /parking /aed /trash /park; do
              curl -s -o /dev/null -m 30 "https://ilsangkit.co.kr${path}" || true
            done

      - name: Deployment Status
        run: echo "✅ Deployment completed successfully!"
