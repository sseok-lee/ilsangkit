name: Deploy to Cafe24

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_INTERNAL_API_BASE: ${{ secrets.NUXT_INTERNAL_API_BASE }}
          NUXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NUXT_PUBLIC_KAKAO_MAP_KEY }}
          NUXT_PUBLIC_GA_ID: ${{ secrets.NUXT_PUBLIC_GA_ID }}
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}

      - name: Package fixed-path build
        env:
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p deploy-bundle/scripts/deploy
          tar -czf deploy-bundle/backend.tgz -C backend dist package.json package-lock.json prisma
          tar -czf deploy-bundle/frontend.tgz -C frontend .output
          cp scripts/deploy/fixed-deploy.sh scripts/deploy/fixed-runtime.mjs scripts/deploy/retire-release-processes.sh deploy-bundle/scripts/deploy/
          cp ecosystem.config.js deploy-bundle/
          (cd deploy-bundle && sha256sum backend.tgz frontend.tgz ecosystem.config.js scripts/deploy/fixed-deploy.sh scripts/deploy/fixed-runtime.mjs scripts/deploy/retire-release-processes.sh > SHA256SUMS)
          echo "DEPLOY_ID=${TESTED_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Upload staged build
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "deploy-bundle/*"
          target: "/home/project2/run/fixed-deploy/${{ env.DEPLOY_ID }}"
          strip_components: 1

      - name: Verify and activate fixed paths
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            export DEPLOY_SHA
            bash "/home/project2/run/fixed-deploy/${DEPLOY_SHA:0:12}/scripts/deploy/fixed-deploy.sh"

      - name: Retire release PM2 processes after public verification
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            DEPLOY_SHA="${{ github.event.workflow_run.head_sha }}"
            export DEPLOY_SHA
            bash "/home/project2/run/fixed-deploy/${DEPLOY_SHA:0:12}/scripts/deploy/retire-release-processes.sh"

      - name: Deployment status
        run: echo "Fixed backend/frontend deployment and generated-release cleanup verified"
