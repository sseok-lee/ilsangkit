name: Deploy to Cafe24

on:
  workflow_run:
    workflows: ["Test"]
    branches: [main]
    types:
      - completed

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Build backend
        run: |
          cd backend
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
          NUXT_INTERNAL_API_BASE: ${{ secrets.NUXT_INTERNAL_API_BASE }}
          NUXT_PUBLIC_KAKAO_MAP_KEY: ${{ secrets.NUXT_PUBLIC_KAKAO_MAP_KEY }}
          NUXT_PUBLIC_GA_ID: ${{ secrets.NUXT_PUBLIC_GA_ID }}
          NCP_MAP_CLIENT_ID: ${{ secrets.NCP_MAP_CLIENT_ID }}
          NCP_MAP_CLIENT_SECRET: ${{ secrets.NCP_MAP_CLIENT_SECRET }}

      - name: Package release artifacts
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          RELEASE_ID="address-${HEAD_SHA:0:12}"
          mkdir -p release-out/backend release-out/frontend release-out/scripts/deploy
          cp -R backend/dist backend/package*.json backend/prisma release-out/backend/
          cp -R frontend/.output release-out/frontend/
          cp scripts/deploy/release.mjs scripts/deploy/deployment-state.mjs scripts/deploy/sync-runtime.mjs scripts/deploy/nginx-release.conf.template release-out/scripts/deploy/
          cp ecosystem.release.config.cjs release-out/
          node - "$RELEASE_ID" <<'NODE'
          const fs = require('node:fs')
          const path = require('node:path')
          const crypto = require('node:crypto')
          const releaseId = process.argv[2]
          const nuxtDir = path.resolve('frontend/.output/public/_nuxt')
          const assets = []
          function walk(dir) {
            if (!fs.existsSync(dir)) return
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name)
              if (entry.isDirectory()) walk(full)
              else if (entry.isFile()) {
                const relativePath = path.relative(nuxtDir, full).split(path.sep).join('/')
                if (relativePath === 'builds/latest.json') continue
                assets.push({
                  path: `/home/project2/deploy/releases/${releaseId}/frontend/.output/public/_nuxt/${relativePath}`,
                  fileName: relativePath,
                  sha256: crypto.createHash('sha256').update(fs.readFileSync(full)).digest('hex'),
                })
              }
            }
          }
          walk(nuxtDir)
          if (assets.length === 0) throw new Error('no hashed frontend _nuxt assets found')
          fs.writeFileSync('release-out/hashed-assets.json', JSON.stringify(assets, null, 2) + '\n')
          NODE
          tar -C release-out/backend -czf release-out/backend.tgz .
          tar -C release-out/frontend -czf release-out/frontend.tgz .
          BACKEND_SHA="$(sha256sum release-out/backend.tgz | awk '{print $1}')"
          FRONTEND_SHA="$(sha256sum release-out/frontend.tgz | awk '{print $1}')"
          cat > release-out/manifest.json <<JSON
          {
            "releaseId": "${RELEASE_ID}",
            "commitSha": "${HEAD_SHA}",
            "workflowSha": "${HEAD_SHA}",
            "backendArtifact": { "path": "/home/project2/release-inbox/${RELEASE_ID}/backend.tgz", "sha256": "${BACKEND_SHA}" },
            "frontendArtifact": { "path": "/home/project2/release-inbox/${RELEASE_ID}/frontend.tgz", "sha256": "${FRONTEND_SHA}" }
          }
          JSON
          echo "RELEASE_ID=${RELEASE_ID}" >> "$GITHUB_ENV"

      - name: Upload immutable release bundle
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          source: "release-out/*"
          target: "/home/project2/release-inbox/${{ env.RELEASE_ID }}"
          strip_components: 1

      - name: Validate and switch release on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            RELEASE_ID="${{ env.RELEASE_ID }}"
            INBOX="/home/project2/release-inbox/${RELEASE_ID}"
            INVENTORY="/home/project2/deploy/inventory.json"
            MANIFEST="${INBOX}/manifest.json"
            RELEASE_SCRIPT="${INBOX}/scripts/deploy/release.mjs"
            HASHED_ASSETS="${INBOX}/hashed-assets.json"
            if [ ! -f "$INVENTORY" ]; then
              echo "[deploy] missing C1 inventory: $INVENTORY" >&2
              exit 2
            fi
            if [ ! -f "$HASHED_ASSETS" ]; then
              echo "[deploy] missing hashed asset manifest: $HASHED_ASSETS" >&2
              exit 2
            fi

            SUMMARY_READY="$(node - "$INVENTORY" <<'NODE'
            const fs = require('node:fs')
            const inventory = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'))
            const activeBackendPort = inventory.active?.backend?.port || 8000
            process.stdout.write(`http://127.0.0.1:${activeBackendPort}/api/internal/release-readiness`)
            NODE
            )"
            SUMMARY_READINESS="$(curl -fsS "$SUMMARY_READY")"

            printf '%s' "$SUMMARY_READINESS" > "$INBOX/readiness.json"
            node "$INBOX/scripts/deploy/deployment-state.mjs" "$INVENTORY" "$MANIFEST" "$HASHED_ASSETS" "$INBOX/readiness.json"

            node "$RELEASE_SCRIPT" deploy --inventory "$INVENTORY" --manifest "$MANIFEST"
            node "$RELEASE_SCRIPT" reconcile --inventory "$INVENTORY" --manifest "$MANIFEST"

      - name: Deployment Status
        run: echo "✅ Release switch completed"
