name: Sync Real Estate Data

on:
  schedule:
    # 매일 새벽 3시 (KST) = UTC 18:00 전날
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Real Estate Data on Server
        # v1.2.5 (2026-01-28) — @master는 재현성/감사 불가라 SHA 핀 사용.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 부동산 sync 루프(8종)만 ~1h10m + 지오코딩·summary 갱신으로 upstream 이
          # 이미 ~1h26m 소요(데이터 증가). 1h30m 으론 청약·색인·사이트맵까지 못 끝내고
          # 매일 타임아웃(2026-06-16/17). 풀런 추정 ~2h20m + 변동 → 3h 로 상향해 여유 확보.
          # 개별 스텝은 각자 timeout(20m 등)으로 캡되고 좀비 가드가 있어 hang 위험은 별개로 차단됨.
          command_timeout: 3h
          script: |
            set -u
            set -x
            echo "[step:start] $(date -u +%FT%TZ)"
            cd /home/project2/backend
            echo "[step:cwd-ok] $(pwd)"

            # pkill -f 는 drone-ssh 가 bash -c '<script>' 로 넘긴 이 스크립트 본문
            # 자체를 argv 에 담은 부모 bash 까지 매칭시켜 SIGKILL 해버린다
            # (2026-04-17 run #24580271281, 2026-04-18 run #24596132685, #24596179994).
            # 해법: pgrep -x node 로 실행 파일명이 정확히 'node' 인 프로세스만 후보로
            # 뽑은 뒤 /proc/<pid>/cmdline 으로 argv 를 확인해 우리 sync 스크립트만 종료.
            # 부모 bash 는 name=bash 이므로 절대 후보에 오르지 않음.
            kill_sync_zombies() {
              local pid cmd
              for pid in $(pgrep -x node 2>/dev/null); do
                cmd=$(tr '\0' ' ' < "/proc/$pid/cmdline" 2>/dev/null)
                case "$cmd" in
                  *dist/scripts/syncApt*|\
                  *dist/scripts/syncVilla*|\
                  *dist/scripts/syncOffitel*|\
                  *dist/scripts/syncLandSale*|\
                  *dist/scripts/geocodeRealEstate*|\
                  *dist/scripts/refreshRealEstateSummary*|\
                  *dist/scripts/syncSubscription*|\
                  *dist/scripts/geocodeSubscriptions*|\
                  *dist/scripts/syncAuction*|\
                  *dist/scripts/geocodeAuction*|\
                  *dist/scripts/generateSitemaps*)
                    kill -9 "$pid" 2>/dev/null || true
                    ;;
                esac
              done
            }

            # --- 좀비 청소 (시작 전) ---------------------------------------
            # 이전 실행에서 남은 sync/geocode/refresh/subscription 프로세스 강제 종료.
            # 2026-04-17 사고 때 SSH 연결 끊겨도 node 가 살아남아 MySQL 을 7시간 잡은
            # 사슬의 1번째 방어선.
            echo "[step:pre-kill]"
            kill_sync_zombies
            echo "[step:pre-kill-done exit=$?]"
            # ilsangkit 유저의 30분 이상 걸린 non-Sleep 커넥션 KILL.
            # information_schema.processlist는 metadata lock 시 hang할 수 있어 SHOW PROCESSLIST 사용.
            echo "[step:pre-mysql-show]"
            mysql -e "SHOW PROCESSLIST" 2>/dev/null \
              | awk '$2=="ilsangkit" && $6+0 > 1800 && $5!="Sleep" {print "KILL "$1";"}' \
              | mysql 2>/dev/null || true
            echo "[step:pre-mysql-done exit=$?]"

            # 현재 월과 직전 월만 동기화 (YYYYMM)
            CURRENT_YM=$(date +%Y%m)
            PREV_YM=$(date -d "1 month ago" +%Y%m 2>/dev/null || date -v-1m +%Y%m)
            echo "[step:ym-resolved PREV=$PREV_YM CUR=$CURRENT_YM]"

            # dist 산출물 존재 선행 체크 — deploy 워크플로우가 선행되지 않은 경우 조기 실패
            if [ ! -f dist/scripts/syncAptSale.js ]; then
              echo "[error] dist/scripts/syncAptSale.js 미존재 — Deploy 워크플로우 선행 실행 필요"
              exit 2
            fi
            echo "[step:dist-ok]"

            echo "=== 부동산 실거래가 동기화 시작 ==="
            echo "대상: ${PREV_YM}, ${CURRENT_YM}"

            # 6개 부동산 타입 순차 실행 (API 부하 분산).
            # `timeout --kill-after=30s 20m`는 스크립트 내부 watchdog(20분)이 뚫려도
            # OS가 SIGTERM→SIGKILL로 반드시 종료시키는 최종 방어선.
            for SCRIPT in syncAptSale syncAptRent syncVillaSale syncVillaRent syncOffitelSale syncOffitelRent syncLandSale syncAuction; do
              echo "[step:loop-${SCRIPT}-start] $(date -u +%FT%TZ)"
              echo "--- ${SCRIPT} 동기화 ---"
              timeout --kill-after=30s 20m node "dist/scripts/${SCRIPT}.js" --from "$PREV_YM" --to "$CURRENT_YM" \
                || echo "[WARN] ${SCRIPT} 실패 (exit=$?)"
              echo "[step:loop-${SCRIPT}-end]"
            done

            # 좌표 없는 건물 지오코딩 (카카오 API rate limit 감안 45분)
            echo "[step:geocode-start]"
            echo "--- 지오코딩 ---"
            timeout --kill-after=30s 45m node dist/scripts/geocodeRealEstate.js \
              || echo "[WARN] 지오코딩 실패 (exit=$?)"
            echo "[step:geocode-end]"

            # 공매 물건 지오코딩 (온비드 API 무좌표 → 카카오 주소검색, 30분)
            echo "[step:geocode-auction-start]"
            echo "--- 공매 지오코딩 ---"
            timeout --kill-after=30s 30m node dist/scripts/geocodeAuction.js \
              || echo "[WARN] 공매 지오코딩 실패 (exit=$?)"
            echo "[step:geocode-auction-end]"

            # Summary 테이블 갱신 (MySQL MAX_EXECUTION_TIME=60s가 내부에서 강제)
            echo "[step:summary-start]"
            echo "--- Summary 갱신 ---"
            timeout --kill-after=30s 15m node dist/scripts/refreshRealEstateSummary.js \
              || echo "[WARN] Summary 갱신 실패 (exit=$?)"
            echo "[step:summary-end]"

            # 청약 분양정보 동기화 (전체 소스)
            # --skip-geocode: 지오코딩은 느리고 항상-실패 주소가 많아 시간예산을 위협한다.
            # 색인·사이트맵을 먼저 끝낸 뒤 맨 마지막 격리 단계에서 지오코딩한다(아래 참조).
            echo "[step:subscription-start]"
            echo "--- 청약 동기화 (지오코딩 제외) ---"
            timeout --kill-after=30s 30m node dist/scripts/syncSubscription.js --source ALL --skip-geocode \
              || echo "[WARN] 청약 동기화 실패 (exit=$?)"
            echo "[step:subscription-end]"

            # Google Indexing API 자동 제출은 중단됨 (2026-06-19).
            # Indexing API 는 공식적으로 JobPosting / BroadcastEvent 타입만 지원하므로
            # 부동산·시설 URL 에는 색인 효과가 없어 매일 quota(200)만 낭비했다.
            # 색인은 sitemap + 자연 크롤에 맡긴다. submitIndexing.ts 와
            # `npm run submit:indexing` 은 수동/향후 용도로 보존(자동 호출만 제거).

            # --- 사이트맵 정적 파일 재생성 -------------------------------
            # 동기화로 데이터가 갱신됐으니 디스크 sitemap 을 새로 굽는다.
            # 실패/가드거부 시 기존 파일 유지(크롤러 영향 없음).
            echo "[step:sitemap-gen-start]"
            echo "--- 사이트맵 정적 재생성 ---"
            export SITEMAP_DIR="/home/project2/sitemaps"
            export SITEMAP_REGEN_BASE="http://127.0.0.1:3000"
            set +x
            export SITEMAP_REGEN_TOKEN="${{ secrets.SITEMAP_REGEN_TOKEN }}"
            set -x
            timeout --kill-after=30s 10m node dist/scripts/generateSitemaps.js \
              || echo "[WARN] 사이트맵 재생성 실패/스킵 (exit=$?)"
            echo "[step:sitemap-gen-end]"

            # --- 청약 주소 지오코딩 (best-effort, 크리티컬 패스 밖) -----------
            # 지오코딩은 블록코드/지구명 등 항상-실패하는 청약 주소가 많아 느리다.
            # 2026-06-16 에 이 작업이 syncSubscription 안에서 1544건을 돌다 전체 잡을
            # 1h30m 타임아웃시켜 구글 색인·사이트맵 재생성이 통째로 스킵됐다.
            # → 색인·사이트맵을 모두 끝낸 뒤 맨 마지막에 격리 실행한다. 실패하거나
            #    타임아웃돼도 위 단계는 이미 완료됐으므로 영향 없음. per-run 상한으로 bound.
            echo "[step:subscription-geocode-start]"
            echo "--- 청약 주소 지오코딩 (격리) ---"
            timeout --kill-after=30s 15m node dist/scripts/geocodeSubscriptions.js \
              || echo "[WARN] 청약 지오코딩 실패/스킵 (exit=$?)"
            echo "[step:subscription-geocode-end]"

            # --- 좀비 청소 (종료 후) -------------------------------------
            # 만에 하나 남은 프로세스/커넥션이 있으면 여기서 확실히 정리.
            echo "[step:post-kill]"
            kill_sync_zombies
            echo "[step:post-mysql]"
            mysql -e "SHOW PROCESSLIST" 2>/dev/null \
              | awk '$2=="ilsangkit" && $6+0 > 1800 && $5!="Sleep" {print "KILL "$1";"}' \
              | mysql 2>/dev/null || true
            echo "[step:post-done]"

            echo "=== 동기화 완료 ==="
