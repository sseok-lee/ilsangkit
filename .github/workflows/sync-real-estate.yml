name: Sync Real Estate Data

on:
  schedule:
    # 매일 새벽 3시 (KST) = UTC 18:00 전날
    - cron: '0 18 * * *'
  workflow_dispatch: # 수동 실행 가능

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Real Estate Data on Server
        # v1.2.5 (2026-01-28) — @master는 재현성/감사 불가라 SHA 핀 사용.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # 부동산 sync 루프(8종)만 ~1h10m + 지오코딩·summary 갱신으로 upstream 이
          # 이미 ~1h26m 소요(데이터 증가). 1h30m 으론 청약·색인·사이트맵까지 못 끝내고
          # 매일 타임아웃(2026-06-16/17). 풀런 추정 ~2h20m + 변동 → 3h 로 상향해 여유 확보.
          # 개별 스텝은 각자 timeout(20m 등)으로 캡되고 좀비 가드가 있어 hang 위험은 별개로 차단됨.
          command_timeout: 3h
          script: |
            set -u
            set -x
            echo "[step:start] $(date -u +%FT%TZ)"
            ACTIVE_BACKEND_LINK="${ILSK_ACTIVE_BACKEND_LINK:-/home/project2/backend}"
            if [ -L /home/project2/current-backend ]; then
              ACTIVE_BACKEND_LINK="/home/project2/current-backend"
            fi
            ACTIVE_BACKEND_DIR="$(cd "$ACTIVE_BACKEND_LINK" && pwd -P)"
            cd "$ACTIVE_BACKEND_DIR"
            echo "[step:active-backend] $ACTIVE_BACKEND_DIR"
            INVENTORY="${ILSK_DEPLOY_INVENTORY:-/home/project2/deploy/inventory.json}"
            SYNC_RUNTIME_SCRIPT="${ILSK_SYNC_RUNTIME_SCRIPT:-}"
            if [ -z "$SYNC_RUNTIME_SCRIPT" ]; then
              ACTIVE_RELEASE_ROOT="$(dirname "$ACTIVE_BACKEND_DIR")"
              SYNC_RUNTIME_SCRIPT="$ACTIVE_RELEASE_ROOT/scripts/deploy/sync-runtime.mjs"
            fi
            if [ -f "$SYNC_RUNTIME_SCRIPT" ]; then
              SYNC_RUNTIME_MODE="release"
              node "$SYNC_RUNTIME_SCRIPT" print --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY" || exit $?
              run_backend_node_timed() {
                RUNTIME_LIMIT="$1"
                shift
                timeout --kill-after=30s "$RUNTIME_LIMIT" node "$SYNC_RUNTIME_SCRIPT" run --active-backend-link "$ACTIVE_BACKEND_LINK" --inventory "$INVENTORY" -- node "$@"
              }
            else
              if [ -L /home/project2/current-backend ]; then
                echo "[error] current-backend is active but sync runtime helper was not found: $SYNC_RUNTIME_SCRIPT"
                exit 2
              fi
              SYNC_RUNTIME_MODE="legacy"
              LEGACY_BACKEND_ENV_FILE="${ILSK_BACKEND_ENV_FILE:-$ACTIVE_BACKEND_DIR/.env}"
              run_backend_node_timed() {
                RUNTIME_LIMIT="$1"
                shift
                if [ -f "$LEGACY_BACKEND_ENV_FILE" ]; then
                  timeout --kill-after=30s "$RUNTIME_LIMIT" node --env-file "$LEGACY_BACKEND_ENV_FILE" "$@"
                else
                  timeout --kill-after=30s "$RUNTIME_LIMIT" node "$@"
                fi
              }
            fi
            export REAL_ESTATE_WRITE_LOCK_DIR="${REAL_ESTATE_WRITE_LOCK_DIR:-/home/project2/run/real-estate-locks}"
            mkdir -p "$REAL_ESTATE_WRITE_LOCK_DIR"
            REAL_ESTATE_SYNC_EXIT=0
            echo "[step:real-estate-lock-dir] $REAL_ESTATE_WRITE_LOCK_DIR"

            # Cooperative writer locking is enforced by each real-estate writer.
            # This workflow no longer kills existing node processes or MySQL sessions; stale locks
            # require explicit token-based recovery by an operator.

            # 현재 월과 직전 월만 동기화 (YYYYMM)
            CURRENT_YM=$(date +%Y%m)
            PREV_YM=$(date -d "1 month ago" +%Y%m 2>/dev/null || date -v-1m +%Y%m)
            echo "[step:ym-resolved PREV=$PREV_YM CUR=$CURRENT_YM]"

            # dist 산출물 존재 선행 체크 — deploy 워크플로우가 선행되지 않은 경우 조기 실패
            if [ ! -f "$ACTIVE_BACKEND_DIR/dist/scripts/syncAptSale.js" ]; then
              echo "[error] dist/scripts/syncAptSale.js 미존재 — Deploy 워크플로우 선행 실행 필요"
              exit 2
            fi
            echo "[step:dist-ok]"

            echo "=== 부동산 실거래가 동기화 시작 ==="
            echo "대상: ${PREV_YM}, ${CURRENT_YM}"

            # 6개 부동산 타입 순차 실행 (API 부하 분산).
            # `timeout --kill-after=30s 20m`는 스크립트 내부 watchdog(20분)이 뚫려도
            # OS가 SIGTERM→SIGKILL로 반드시 종료시키는 최종 방어선.
            for SCRIPT in syncAptSale syncAptRent syncVillaSale syncVillaRent syncOffitelSale syncOffitelRent syncLandSale syncAuction; do
              echo "[step:loop-${SCRIPT}-start] $(date -u +%FT%TZ)"
              echo "--- ${SCRIPT} 동기화 ---"
              SCRIPT_EXIT=0
              run_backend_node_timed 20m "$ACTIVE_BACKEND_DIR/dist/scripts/${SCRIPT}.js" --from "$PREV_YM" --to "$CURRENT_YM" || SCRIPT_EXIT=$?
              if [ "$SCRIPT_EXIT" -ne 0 ]; then
                echo "::warning::${SCRIPT} 실패 (exit=$SCRIPT_EXIT)"
                REAL_ESTATE_SYNC_EXIT=4
              fi
              echo "[step:loop-${SCRIPT}-end]"
            done

            # 좌표 없는 건물 지오코딩 (카카오 API rate limit 감안 45분)
            echo "[step:geocode-start]"
            echo "--- 지오코딩 ---"
            run_backend_node_timed 45m "$ACTIVE_BACKEND_DIR/dist/scripts/geocodeRealEstate.js" \
              || echo "[WARN] 지오코딩 실패 (exit=$?)"
            echo "[step:geocode-end]"

            # 공매 물건 지오코딩 (온비드 API 무좌표 → 카카오 주소검색, 30분)
            echo "[step:geocode-auction-start]"
            echo "--- 공매 지오코딩 ---"
            run_backend_node_timed 30m "$ACTIVE_BACKEND_DIR/dist/scripts/geocodeAuction.js" \
              || echo "[WARN] 공매 지오코딩 실패 (exit=$?)"
            echo "[step:geocode-auction-end]"

            # Summary 테이블 갱신 (MySQL MAX_EXECUTION_TIME=60s가 내부에서 강제)
            #
            # 25m 인 이유: 전월세 3종에 전세/월세 분리 UPDATE 패스가 추가되면서(2026-08-06 배포)
            # 6종 합계가 11.6분 → 14.3분이 됐고, 이후 데이터 증가가 얹혀 15분을 넘겼다.
            # 실측 — 8/8 은 offitel-rent 1종, 8/9 는 villa-rent·offitel 2종이 안 돌고
            # `[WARN] Summary 갱신 실패 (exit=124)` 만 남긴 채 워크플로는 success 로 끝났다
            # (124 = timeout 이 죽인 것). 뒤 타입일수록 조용히 스킵되는 구조라 상한을 올린다.
            #
            # 근본 원인은 따로 있다: 분리 UPDATE 의 PARTITION BY 에 rentType 이 들어가는데
            # 거래 테이블 인덱스가 (buildingName, bjdCode, dealYear, dealMonth, dealDay) 라
            # 정렬을 못 받쳐 filesort 가 걸린다(운영 EXPLAIN 실측: 경기 apt-rent 117만 행
            # Using filesort). 인덱스가 붙으면 이 상한은 다시 내려도 된다.
            #   0=6종 완주 / 4=일부 타입 실패 / 124=timeout 이 죽임(뒤 타입 미실행) / 그 외=예외
            # 종전에는 `|| echo "[WARN] ..."` 로만 흘려서 Actions UI 에는 success 로만 보였고,
            # 8/8·8/9 에 villa-rent·offitel 이 안 돌았는데 아무도 몰랐다. 사이트맵 단계와
            # 같은 규약(::warning:: + 종료 코드 분기)으로 맞춘다.
            echo "[step:summary-start]"
            echo "--- Summary 갱신 ---"
            SUMMARY_EXIT=0
            run_backend_node_timed 25m "$ACTIVE_BACKEND_DIR/dist/scripts/refreshRealEstateSummary.js" || SUMMARY_EXIT=$?
            case "$SUMMARY_EXIT" in
              0) echo "[sync] Summary 갱신 완료" ;;
              4) echo "::warning::Summary 일부 타입 실패 — 위 로그의 '실패한 타입' 확인. 그 타입은 어제 값이 남는다."; REAL_ESTATE_SYNC_EXIT=4 ;;
              124|137) echo "::warning::Summary 가 25분 예산을 초과해 강제 종료됐다(exit=$SUMMARY_EXIT). 뒤쪽 타입(villa-rent·offitel)이 실행되지 않았을 수 있다 — 위 로그의 '완료 N/6' 확인."; REAL_ESTATE_SYNC_EXIT=4 ;;
              *) echo "::warning::Summary 갱신 실패 (exit=$SUMMARY_EXIT) — 전 타입이 어제 값으로 남는다."; REAL_ESTATE_SYNC_EXIT=4 ;;
            esac
            echo "[step:summary-end]"

            # 청약 분양정보 동기화 (전체 소스)
            # --skip-geocode: 지오코딩은 느리고 항상-실패 주소가 많아 시간예산을 위협한다.
            # 색인·사이트맵을 먼저 끝낸 뒤 맨 마지막 격리 단계에서 지오코딩한다(아래 참조).
            echo "[step:subscription-start]"
            echo "--- 청약 동기화 (지오코딩 제외) ---"
            run_backend_node_timed 30m "$ACTIVE_BACKEND_DIR/dist/scripts/syncSubscription.js" --source ALL --skip-geocode \
              || echo "[WARN] 청약 동기화 실패 (exit=$?)"
            echo "[step:subscription-end]"

            # 마이홈 + LH 공공임대 (공고 식별자로 병합, 주소 지오코딩 제외)
            echo "[step:public-rental-start]"
            run_backend_node_timed 20m "$ACTIVE_BACKEND_DIR/dist/scripts/syncPublicRental.js" --write \
              || echo "::warning::공공임대 동기화 실패 (exit=$?) — sub-public-rent 이력 확인"
            echo "[step:public-rental-end]"

            # Google Indexing API 자동 제출은 중단됨 (2026-06-19).
            # Indexing API 는 공식적으로 JobPosting / BroadcastEvent 타입만 지원하므로
            # 부동산·시설 URL 에는 색인 효과가 없어 매일 quota(200)만 낭비했다.
            # 색인은 sitemap + 자연 크롤에 맡긴다. submitIndexing.ts 와
            # `npm run submit:indexing` 은 수동/향후 용도로 보존(자동 호출만 제거).

            # --- 사이트맵 정적 파일 재생성 -------------------------------
            # 동기화로 데이터가 갱신됐으니 디스크 sitemap 을 새로 굽는다.
            # 실패/가드거부 시 기존 파일 유지(크롤러 영향 없음).
            echo "[step:sitemap-gen-start]"
            echo "--- 사이트맵 정적 재생성 ---"
            if [ "$SYNC_RUNTIME_MODE" = "legacy" ]; then
              export SITEMAP_DIR="${SITEMAP_DIR:-/home/project2/sitemaps}"
              export SITEMAP_REGEN_BASE="${SITEMAP_REGEN_BASE:-http://127.0.0.1:3000}"
            fi
            set +x
            export SITEMAP_REGEN_TOKEN="${{ secrets.SITEMAP_REGEN_TOKEN }}"
            set -x
            # backend 집계 캐시 선점은 제거됐다. /api/sitemap/real-estate-buildings 가
            # RealEstateBuildingSummary 를 읽도록 바뀌어 0.34초(종전 56초)이고 캐시도 두지 않는다.
            # 워밍할 캐시가 없으므로 선점 자체가 무의미하다.

            # 종전에는 결과를 `|| echo "[WARN] 실패/스킵"` 로만 흘렸다. 그 결과 exit 4(부분 갱신)
            # 까지 "실패/스킵" 으로 표기되고 Actions UI 에는 success 로만 보여서, 매일 새벽
            # 어떤 파일이 이월됐는지 아무도 알 수 없었다(2026-07-28 static.xml 이월 사례).
            #   0=완전 갱신 / 4=부분 갱신(일부 이월) / 2=거부·실패 / 3=예외 / 1=env 누락
            # 예산 10m→20m: 자식 하나당 최대 120초(SITEMAP_FETCH_TIMEOUT_MS)를 쓸 수 있고
            # 자식이 78개다. deploy.yml 과 동일하게 맞춘다.
            SITEMAP_EXIT=0
            run_backend_node_timed 20m "$ACTIVE_BACKEND_DIR/dist/scripts/generateSitemaps.js" || SITEMAP_EXIT=$?
            case "$SITEMAP_EXIT" in
              0) echo "[sync] 사이트맵 갱신 완료" ;;
              4) echo "::warning::사이트맵 부분 갱신 — 일부 파일이 직전 생성본으로 이월됐다. 위 로그의 이월 목록 확인." ;;
              *) echo "::warning::사이트맵 생성 실패/거부 (exit=$SITEMAP_EXIT) — 기존 파일 유지. 반복되면 stale 사이트맵이 서빙된다." ;;
            esac
            echo "[step:sitemap-gen-end]"

            # --- 청약 주소 지오코딩 (best-effort, 크리티컬 패스 밖) -----------
            # 지오코딩은 블록코드/지구명 등 항상-실패하는 청약 주소가 많아 느리다.
            # 2026-06-16 에 이 작업이 syncSubscription 안에서 1544건을 돌다 전체 잡을
            # 1h30m 타임아웃시켜 구글 색인·사이트맵 재생성이 통째로 스킵됐다.
            # → 색인·사이트맵을 모두 끝낸 뒤 맨 마지막에 격리 실행한다. 실패하거나
            #    타임아웃돼도 위 단계는 이미 완료됐으므로 영향 없음. per-run 상한으로 bound.
            echo "[step:subscription-geocode-start]"
            echo "--- 청약 주소 지오코딩 (격리) ---"
            run_backend_node_timed 15m "$ACTIVE_BACKEND_DIR/dist/scripts/geocodeSubscriptions.js" \
              || echo "[WARN] 청약 지오코딩 실패/스킵 (exit=$?)"
            echo "[step:subscription-geocode-end]"

            if [ "$REAL_ESTATE_SYNC_EXIT" -ne 0 ]; then
              echo "::warning::부동산 writer 단계에서 실패가 발생했다(exit=$REAL_ESTATE_SYNC_EXIT). 전체 작업은 완료했지만 워크플로는 실패로 종료한다."
              exit "$REAL_ESTATE_SYNC_EXIT"
            fi

            echo "=== 동기화 완료 ==="
