name: Sync Real Estate Data

# 매일 03:00 KST 실행은 운영 서버 cron(/etc/cron.d/ilsangkit-sync)이 맡는다(2026-10-18).
# GitHub '0 18 * * *' 예약은 정각 대기열 지연으로 매일 2~6시간 늦게 시작했다.
# 이 워크플로는 수동 재실행용이며, 서버 cron 과 같은 스크립트(scripts/ops/sync-real-estate.sh,
# 배포가 /home/project2/ops 에 설치)를 실행한다. 동시 실행은 스크립트의 잠금이 막는다.
on:
  workflow_dispatch:

concurrency:
  group: cafe24-db
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Real Estate Data on Server
        # v1.2.5 (2026-01-28) — @master는 재현성/감사 불가라 SHA 핀 사용.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # 부동산 sync 루프(8종)만 ~1h10m + 지오코딩·summary 갱신으로 upstream 이
          # 이미 ~1h26m 소요(데이터 증가). 1h30m 으론 청약·색인·사이트맵까지 못 끝내고
          # 매일 타임아웃(2026-06-16/17). 풀런 추정 ~2h20m + 변동 → 3h 로 상향해 여유 확보.
          # 개별 스텝은 각자 timeout(20m 등)으로 캡되고 좀비 가드가 있어 hang 위험은 별개로 차단됨.
          command_timeout: 3h
          script: |
            set -euo pipefail
            bash /home/project2/ops/sync-real-estate.sh
