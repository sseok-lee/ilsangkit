name: Test
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ilsangkit_test
        ports:
          - 3307:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DATABASE_URL: mysql://root:testpassword@localhost:3307/ilsangkit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: cd backend && npm ci
      - run: cd backend && npx prisma generate
      - run: cd backend && npx prisma db push --skip-generate
      - run: cd backend && npm run lint
      - run: cd backend && npm run test
      - name: Verify affiliate disclosure migration and integration
        env:
          AFFILIATE_TEST_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
          AFFILIATE_TEST_DATABASE_URL: mysql://root:testpassword@127.0.0.1:3307/ilsangkit_affiliate_test
          MYSQL_PWD: testpassword
        run: |
          docker exec -e MYSQL_PWD "$AFFILIATE_TEST_MYSQL_CONTAINER" mysql -uroot -e 'CREATE DATABASE ilsangkit_affiliate_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci'
          docker exec -i -e MYSQL_PWD "$AFFILIATE_TEST_MYSQL_CONTAINER" mysql -uroot ilsangkit_affiliate_test < backend/prisma/migrations/202610060001_affiliate_banners/migration.sql
          docker exec -e MYSQL_PWD "$AFFILIATE_TEST_MYSQL_CONTAINER" mysql -uroot ilsangkit_affiliate_test -e "INSERT INTO AffiliateBanner (id,provider,name,imageSourceType,targetUrl,externalImageUrl,altText,isEnabled,updatedAt) VALUES ('00000000-0000-4000-8000-000000000007','coupang','migration-fixture','url','https://example.test/go?a=1','https://example.test/banner.png','fixture',true,'2026-10-07 00:00:00.000')"
          docker exec -i -e MYSQL_PWD "$AFFILIATE_TEST_MYSQL_CONTAINER" mysql -uroot ilsangkit_affiliate_test < backend/prisma/migrations/202610070001_affiliate_disclosures/migration.sql
          docker exec -i -e MYSQL_PWD "$AFFILIATE_TEST_MYSQL_CONTAINER" mysql -uroot ilsangkit_affiliate_test < backend/prisma/migrations/202610080001_affiliate_banner_expiration/migration.sql
          cd backend
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { PrismaClient } from '@prisma/client';
          const db = new PrismaClient({ datasources: { db: { url: process.env.AFFILIATE_TEST_DATABASE_URL } } });
          const id = '00000000-0000-4000-8000-000000000007';
          try {
            const row = await db.affiliateBanner.findUniqueOrThrow({ where: { id } });
            assert.equal(row.isEnabled, true);
            assert.equal(row.provider, 'coupang');
            assert.equal(row.name, 'migration-fixture');
            assert.equal(row.targetUrl, 'https://example.test/go?a=1');
            assert.equal(row.externalImageUrl, 'https://example.test/banner.png');
            assert.equal(row.disclosureOverride, null);
            assert.equal(row.expiresAt, null);
            assert.equal(row.updatedAt.toISOString(), '2026-10-07T00:00:00.000Z');
            assert.equal(await db.affiliateProviderDisclosure.count(), 0);
          } finally {
            await db.affiliateBanner.deleteMany({ where: { id } });
            await db.$disconnect();
          }
          NODE
          npm run test:affiliate-integration
      - name: Verify deployment and release runtime contracts
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          const files = readdirSync('scripts/deploy').filter(name => name.endsWith('.test.mjs') && !name.endsWith('.mysql.test.mjs')).map(name => `scripts/deploy/${name}`);
          process.exit(spawnSync(process.execPath, ['--test', ...files], { stdio: 'inherit' }).status ?? 1);
          NODE

  test-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: migration-test-only
        ports:
          - 3308:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=6
    env:
      MIGRATION_TEST_ADMIN_URL: mysql://root:migration-test-only@127.0.0.1:3308/mysql
      MIGRATION_EVIDENCE_DIR: ${{ runner.temp }}/db-evidence
      MIGRATION_COMPAT_WORK_DIR: ${{ runner.temp }}/db-compatibility
      COMPATIBILITY_EVIDENCE_FILE: ${{ runner.temp }}/db-compatibility/compatibility-evidence.json
      PREPARATION_COMPATIBILITY_FILE: ${{ runner.temp }}/db-compatibility/preparation-compatibility.json
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Verify MySQL 8 client and install candidate dependencies
        run: |
          set -euo pipefail
          mysql --version | grep -E 'Ver 8\.'
          mysqldump --version | grep -E 'Ver 8\.'
          cd backend
          npm ci
          npx prisma generate
          npm run build
      - name: Replay history, restore backups and prove interruption recovery
        run: |
          node --test --test-concurrency=1 scripts/deploy/db-baseline.mysql.test.mjs scripts/deploy/db-schema.mysql.test.mjs scripts/deploy/db-backup.mysql.test.mjs scripts/deploy/db-migration-gate.mysql.test.mjs scripts/deploy/db-maintenance.mysql.test.mjs scripts/deploy/db-compatibility.mysql.test.mjs
      - name: Execute previous and candidate application compatibility
        run: node scripts/deploy/db-compatibility.mjs
      - name: Build SHA-bound schema evidence
        run: node scripts/deploy/db-evidence.mjs build
      - name: Publish verified schema evidence
        uses: actions/upload-artifact@v4
        with:
          name: db-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ env.MIGRATION_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npx nuxt prepare
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run test
      - run: cd frontend && npm run build
