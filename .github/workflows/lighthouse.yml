name: Lighthouse CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend/**'
      - '.github/workflows/lighthouse.yml'
      - 'lighthouserc.js'

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: ilsangkit_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    env:
      DATABASE_URL: mysql://root:testpassword@localhost:3306/ilsangkit_test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # Backend 기동 — Phase 2 503 throw가 SSR home-dashboard fetch 성공을 요구.
      # backend 없이 lighthouse 측정하면 503 응답으로 ERRORED_DOCUMENT_REQUEST 발생.
      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Apply Prisma schema
        run: cd backend && npx prisma db push --skip-generate

      - name: Seed minimal DB data
        run: cd backend && npm run db:seed

      - name: Start backend in background
        run: cd backend && (npm run dev &) && sleep 8

      - name: Wait for backend health
        run: |
          for i in {1..15}; do
            if curl -fsS http://localhost:8000/api/health > /dev/null; then
              echo "Backend ready"
              exit 0
            fi
            echo "Waiting for backend (attempt $i)..."
            sleep 2
          done
          echo "Backend failed to start within 30s"
          exit 1

      # Frontend build + Lighthouse
      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Prepare Nuxt
        run: cd frontend && npx nuxt prepare

      - name: Build frontend for production
        run: cd frontend && npm run build
        env:
          NUXT_PUBLIC_API_BASE: http://localhost:8000
          NUXT_PUBLIC_KAKAO_MAP_KEY: dummy_key_for_ci
          NUXT_PUBLIC_GA_ID: G-XXXXXXXXXX

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          cd frontend
          lhci autorun --config=../lighthouserc.js
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: frontend/.lighthouseci
          retention-days: 30

      - name: Comment PR with results
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read the manifest to find the latest report
            const manifestPath = path.join(process.cwd(), 'frontend/.lighthouseci/manifest.json');
            if (!fs.existsSync(manifestPath)) {
              console.log('No Lighthouse results found');
              return;
            }

            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            if (!manifest || manifest.length === 0) {
              console.log('Empty manifest');
              return;
            }

            // Get the first run's report
            const reportPath = manifest[0].jsonPath;
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const { categories } = report;
            const scores = {
              performance: Math.round(categories.performance.score * 100),
              accessibility: Math.round(categories.accessibility.score * 100),
              bestPractices: Math.round(categories['best-practices'].score * 100),
              seo: Math.round(categories.seo.score * 100),
            };

            const getEmoji = (score, threshold) => score >= threshold ? '✅' : '❌';

            const comment = `## 🔦 Lighthouse CI Results

            | Category | Score | Status |
            |----------|-------|--------|
            | Performance | ${scores.performance} | ${getEmoji(scores.performance, 90)} |
            | Accessibility | ${scores.accessibility} | ${getEmoji(scores.accessibility, 85)} |
            | Best Practices | ${scores.bestPractices} | ${getEmoji(scores.bestPractices, 80)} |
            | SEO | ${scores.seo} | ${getEmoji(scores.seo, 90)} |

            **Thresholds:** Performance ≥ 90, Accessibility ≥ 85, Best Practices ≥ 80, SEO ≥ 90

            [View detailed report](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
